<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAULITO QUIZ</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; text-align: center; background: #2c3e50; color: white; padding: 20px; }
        .hidden { display: none; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #3498db; border: none; color: white; border-radius: 8px; font-size: 18px; }
        #timer { font-size: 24px; color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>RAULITO QUIZ</h1>
        <p>Puntos: <span id="score">0</span> / 40.000</p>
        <div id="timer">15</div>
        <h2 id="question">Cargando...</h2>
        <div id="options"></div>
    </div>

    <div id="win-screen" class="hidden">
        <h1>¡FELICIDADES!</h1>
        <p>Has alcanzado los 40.000 puntos.</p>
        <button class="btn" onclick="location.reload()">Jugar de nuevo</button>
    </div>

    <script>
        const preguntas = [
            {p: "¿Quién fundó los Scouts?", o: ["Baden-Powell", "San Jorge", "B.P. Simpson"], c: "Baden-Powell"},
            {p: "¿Cuál es el lema Scout?", o: ["Siempre Listos", "Dar lo mejor", "Servir"], c: "Siempre Listos"},
            {p: "¿Dónde fue el Jamboree Mundial en Chile?", o: ["Picarquín", "Osorno", "Valparaíso"], c: "Picarquín"},
            {p: "¿Rama de 6 a 11 años?", o: ["Lobatos/Golondrinas", "Ruta", "Tropa"], c: "Lobatos/Golondrinas"},
            {p: "¿Color de la pañoleta nacional?", o: ["Rojo, azul y blanco", "Verde", "Amarillo"], c: "Rojo, azul y blanco"},
            {p: "¿Qué animal representa a la Manada?", o: ["Lobo", "Águila", "Zorro"], c: "Lobo"},
            {p: "¿Santo Patrono de los Scouts?", o: ["San Jorge", "San Francisco", "San Pedro"], c: "San Jorge"},
            {p: "¿Significado de la Buena Acción?", o: ["Ayudar al prójimo", "Hacer nudos", "Cantar"], c: "Ayudar al prójimo"},
            {p: "¿Capital de Chile?", o: ["Santiago", "Valdivia", "Concepción"], c: "Santiago"},
            {p: "¿Idioma de Brasil?", o: ["Portugués", "Español", "Inglés"], c: "Portugués"},
            {p: "¿Planeta más grande?", o: ["Júpiter", "Marte", "Tierra"], c: "Júpiter"},
            {p: "¿Moneda de Chile?", o: ["Peso", "Dólar", "Euro"], c: "Peso"},
            {p: "¿Continente de Egipto?", o: ["África", "Asia", "Europa"], c: "África"},
            {p: "¿Metal más caro?", o: ["Rodio", "Oro", "Cobre"], c: "Rodio"},
            {p: "¿Héroe del Combate de Iquique?", o: ["Arturo Prat", "Bernardo O'Higgins", "Manuel Rodríguez"], c: "Arturo Prat"},
            {p: "¿Pintor de la Mona Lisa?", o: ["Da Vinci", "Van Gogh", "Dalí"], c: "Da Vinci"}
        ];

        let score = 0;
        let timeLeft = 15;
        let timer;

        function nextQuestion() {
            if (score >= 40000) {
                document.getElementById('game-container').classList.add('hidden');
                document.getElementById('win-screen').classList.remove('hidden');
                return;
            }

            clearInterval(timer);
            timeLeft = 15;
            document.getElementById('timer').innerText = timeLeft;
            
            const q = preguntas[Math.floor(Math.random() * preguntas.length)];
            document.getElementById('question').innerText = q.p;
            const opts = document.getElementById('options');
            opts.innerHTML = '';
            
            q.o.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    if (opt === q.c) score += 5000;
                    document.getElementById('score').innerText = score;
                    nextQuestion();
                };
                opts.appendChild(btn);
            });

            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) nextQuestion();
            }, 1000);
        }

        nextQuestion();
    </script>
</body>
</html>
