<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAULITO QUIZ</title>
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #007bff; border: none; color: white; border-radius: 8px; font-size: 18px; cursor: pointer; transition: all 0.3s ease; }
        #timer { font-size: 28px; color: #ff4757; font-weight: bold; margin: 10px 0; }
        #score { transition: all 0.3s ease; display: inline-block; font-weight: bold; color: #2ed573; }
        .hidden { display: none; }
        h2 { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container" id="game-container">
        <h1>RAULITO QUIZ</h1>
        <p>Puntos: <span id="score">0</span> / 40.000</p>
        <div id="timer">15</div>
        <h2 id="question">Cargando...</h2>
        <div id="options"></div>
    </div>

    <div class="container hidden" id="win-screen">
        <h1 style="color: #2ed573;">¡FELICIDADES!</h1>
        <p>Has alcanzado los 40.000 puntos.</p>
        <button class="btn" onclick="location.reload()">Jugar de nuevo</button>
    </div>

    <script>
        const banco = [
            {p: "¿Quién fundó el Movimiento Scout?", o: ["Baden-Powell", "San Jorge", "Peter Pan"], c: "Baden-Powell"},
            {p: "¿Cuál es el lema de los Scouts en Chile?", o: ["Siempre Listos", "Dar lo mejor", "Servir"], c: "Siempre Listos"},
            {p: "¿Dónde fue el Jamboree Mundial en Chile?", o: ["Picarquín", "Osorno", "Chillán"], c: "Picarquín"},
            {p: "¿Cómo se llama la rama de 6 a 11 años?", o: ["Lobatos/Golondrinas", "Ruta", "Tropa"], c: "Lobatos/Golondrinas"},
            {p: "¿Qué animal representa a la Manada?", o: ["Lobo", "Águila", "Zorro"], c: "Lobo"},
            {p: "¿Cuál es el color de la pañoleta nacional?", o: ["Rojo, azul y blanco", "Verde y gris", "Azul entero"], c: "Rojo, azul y blanco"},
            {p: "¿Qué significa la Flor de Lis?", o: ["Símbolo Scout", "Una planta real", "Un nudo"], c: "Símbolo Scout"},
            {p: "¿Qué es la 'Buena Acción' diaria?", o: ["Ayudar al prójimo", "Hacer ejercicio", "Ganar dinero"], c: "Ayudar al prójimo"},
            {p: "¿Cuál es la capital de Chile?", o: ["Santiago", "Valdivia", "Concepción"], c: "Santiago"},
            {p: "¿Qué idioma se habla en Brasil?", o: ["Portugués", "Español", "Francés"], c: "Portugués"},
            {p: "¿Cuál es el planeta más grande?", o: ["Júpiter", "Marte", "Saturno"], c: "Júpiter"},
            {p: "¿En qué continente está Egipto?", o: ["África", "Asia", "Europa"], c: "África"},
            {p: "¿Quién pintó la Mona Lisa?", o: ["Da Vinci", "Picasso", "Dalí"], c: "Da Vinci"},
            {p: "¿Cuál es el metal más caro del mundo?", o: ["Rodio", "Oro", "Plata"], c: "Rodio"},
            {p: "¿Héroe del Combate Naval de Iquique?", o: ["Arturo Prat", "O'Higgins", "Baquedano"], c: "Arturo Prat"},
            {p: "¿Qué país tiene forma de bota?", o: ["Italia", "Chile", "Grecia"], c: "Italia"}
        ];

        let puntaje = 0;
        let t;
        let segs = 15;

        function cargar() {
            if (puntaje >= 40000) {
                document.getElementById('game-container').classList.add('hidden');
                document.getElementById('win-screen').classList.remove('hidden');
                return;
            }
            clearInterval(t);
            segs = 15;
            document.getElementById('timer').innerText = segs;
            
            const q = banco[Math.floor(Math.random() * banco.length)];
            document.getElementById('question').innerText = q.p;
            const caja = document.getElementById('options');
            caja.innerHTML = '';
            
            const opcionesMezcladas = [...q.o].sort(() => Math.random() - 0.5);
            
            opcionesMezcladas.forEach(opcion => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.innerText = opcion;
                b.onclick = () => {
                    const botones = caja.querySelectorAll('.btn');
                    botones.forEach(btn => btn.style.pointerEvents = 'none');
                    clearInterval(t);

                    if (opcion === q.c) {
                        b.style.background = "#2ed573";
                        puntaje += 5000;
                    } else {
                        b.style.background = "#ff4757";
                        puntaje = Math.max(0, puntaje - 100);
                        botones.forEach(btn => {
                            if (btn.innerText === q.c) {
                                btn.style.background = "#2ed573";
                                btn.style.animation = "pulse 0.5s infinite";
                            }
                        });
                    }
                    document.getElementById('score').innerText = puntaje;
                    setTimeout(cargar, 1500);
                };
                caja.appendChild(b);
            });

            t = setInterval(() => {
                segs--;
                document.getElementById('timer').innerText = segs;
                if (segs <= 0) {
                    clearInterval(t);
                    puntaje = Math.max(0, puntaje - 100);
                    document.getElementById('score').innerText = puntaje;
                    const botones = caja.querySelectorAll('.btn');
                    botones.forEach(btn => {
                        btn.style.pointerEvents = 'none';
                        if (btn.innerText === q.c) btn.style.background = "#2ed573";
                    });
                    setTimeout(cargar, 1500);
                }
            }, 1000);
        }
        cargar();
    </script>
</body>
</html>
