<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAULITO QUIZ</title>
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #007bff; border: none; color: white; border-radius: 8px; font-size: 18px; cursor: pointer; transition: all 0.3s ease; }
        #timer { font-size: 28px; color: #ff4757; font-weight: bold; margin: 10px 0; }
        #score { transition: all 0.3s ease; display: inline-block; font-weight: bold; color: #2ed573; font-size: 24px; }
        .hidden { display: none; }
        h2 { animation: fadeIn 0.5s ease-in; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container" id="game-container">
        <h1>RAULITO QUIZ</h1>
        <p>Puntos: <span id="score">0</span> / 60.000</p>
        <div id="timer">15</div>
        <h2 id="question">Cargando...</h2>
        <div id="options"></div>
    </div>

    <div class="container hidden" id="win-screen">
        <h1 style="color: #2ed573;">¡FELICIDADES!</h1>
        <p>Has alcanzado los 60.000 puntos.</p>
        <button class="btn" onclick="location.reload()">Jugar de nuevo</button>
    </div>

    <script>
        const bancoOriginal = [
            {p: "¿Cuál es la comida favorita de Emi?", o: ["Pepinillo", "Pepino", "Pickle"], c: "Pepino"},
            {p: "¿Cuál es el nombre de la hija de la Vero?", o: ["Alice", "Alicia", "Aliss"], c: "Alice"},
            {p: "¿Qué instrumento tocó Martincito durante Camver 2026?", o: ["Guitarra", "Ukelele", "Violín"], c: "Guitarra"},
            {p: "¿Qué animal picó el pie de Isi durante Camver 2026?", o: ["Avispa", "Abeja", "Avión"], c: "Avispa"},
            {p: "¿Qué le salió a Franco en la colita durante Paxtú?", o: ["Abceso", "Acceso", "Esspreso (Un café)"], c: "Abceso"},
            {p: "¿Por qué razón entró Choli al grupo?", o: ["Lo invitaron", "Hurto a mano armada", "Raptamos a su familia"], c: "Lo invitaron"},
            {p: "¿Qué practica Matoas online?", o: ["Danza", "Acupuntura", "Armado y desarmado de bombas"], c: "Danza"},
            {p: "¿Qué significan los colores rojo y blanco del pañolín de grupo?", o: ["Pureza y sangre mapuche", "Bastón de caramelo", "Rojo por el clan y blanco por la nieve"], c: "Pureza y sangre mapuche"},
            {p: "¿Quién pintó a la Mona Lisa?", o: ["El tío Da Vinci", "Arturo Pratt", "Piñera"], c: "El tío Da Vinci"},
            {p: "¿Cuál es el país más grande del mundo?", o: ["Rusia", "Patricia Maldonado", "Júpiter"], c: "Rusia"},
            {p: "¿Cuál es el metal cuyo símbolo químico es 'Au'?", o: ["Oro", "Crucero", "Básquetbol"], c: "Oro"},
            {p: "¿Cuál es el río más largo del mundo?", o: ["Amazonas", "Río Rahue", "Mapocho"], c: "Amazonas"},
            {p: "¿Quién fue la tercera pareja de Gala en 'Volverías con tu ex'?", o: ["Leandro", "Marco", "Luis"], c: "Leandro"},
            {p: "¿Quién del clan es gachatuber famoso en secreto?", o: ["Ro", "Matoas", "May"], c: "Ro"},
            {p: "¿Cómo se llamaba el programa juvenil donde bailaban 'axé'?", o: ["Mekano", "Rojo", "Calle 7"], c: "Mekano"},
            {p: "¿Qué personaje decía '¡Tangananica o tangananá!'?", o: ["Guru Guru", "Tulio Triviño", "Juan Carlos Bodoque"], c: "Guru Guru"}
        ];

        let puntaje = 0;
        let t;
        let segs = 15;
        let preguntasPendientes = [];

        function mezclarBanco() {
            preguntasPendientes = [...bancoOriginal].sort(() => Math.random() - 0.5);
        }

        function cargar() {
            if (puntaje >= 60000) {
                document.getElementById('game-container').classList.add('hidden');
                document.getElementById('win-screen').classList.remove('hidden');
                return;
            }

            if (preguntasPendientes.length === 0) {
                mezclarBanco();
            }

            clearInterval(t);
            segs = 15;
            document.getElementById('timer').innerText = segs;
            
            const q = preguntasPendientes.pop();
            document.getElementById('question').innerText = q.p;
            
            const caja = document.getElementById('options');
            caja.innerHTML = '';
            
            const opcionesMezcladas = [...q.o].sort(() => Math.random() - 0.5);
            
            opcionesMezcladas.forEach(opcion => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.innerText = opcion;
                b.onclick = () => {
                    const botones = caja.querySelectorAll('.btn');
                    botones.forEach(btn => btn.style.pointerEvents = 'none');
                    clearInterval(t);

                    if (opcion === q.c) {
                        b.style.background = "#2ed573";
                        b.style.transform = "scale(1.05)";
                        puntaje += 5000;
                    } else {
                        b.style.background = "#ff4757";
                        puntaje = Math.max(0, puntaje - 100);
                        botones.forEach(btn => {
                            if (btn.innerText === q.c) {
                                btn.style.background = "#2ed573";
                                btn.style.animation = "pulse 0.5s infinite";
                            }
                        });
                    }
                    document.getElementById('score').innerText = puntaje;
                    setTimeout(cargar, 1500);
                };
                caja.appendChild(b);
            });

            t = setInterval(() => {
                segs--;
                document.getElementById('timer').innerText = segs;
                if (segs <= 0) {
                    clearInterval(t);
                    puntaje = Math.max(0, puntaje - 100);
                    document.getElementById('score').innerText = puntaje;
                    const botones = caja.querySelectorAll('.btn');
                    botones.forEach(btn => {
                        btn.style.pointerEvents = 'none';
                        if (btn.innerText === q.c) btn.style.background = "#2ed573";
                    });
                    setTimeout(cargar, 1500);
                }
            }, 1000);
        }

        mezclarBanco();
        cargar();
    </script>
</body>
</html>
