<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAULITO QUIZ</title>
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 15px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #007bff; border: none; color: white; border-radius: 8px; font-size: 18px; cursor: pointer; }
        #timer { font-size: 28px; color: #ff4757; font-weight: bold; }
        .hidden { display: none; }
        .btn {
            transition: all 0.3s ease; /* Animación suave de color y tamaño */
        }

        /* Animación de pulso para la respuesta correcta cuando te equivocas */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Animación de entrada para la pregunta */
        h2 {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container" id="game-container">
        <h1>RAULITO QUIZ</h1>
        <p>Puntos: <strong id="score">0</strong> / 40.000</p>
        <div id="timer">15</div>
        <h2 id="question">Cargando...</h2>
        <div id="options"></div>
    </div>

    <div class="container hidden" id="win-screen">
        <h1>¡FELICIDADES!</h1>
        <p>Meta de 40.000 puntos alcanzada.</p>
        <button class="btn" onclick="location.reload()">Reiniciar</button>
    </div>

    <script>
        const banco = [
            {p: "¿Quién fundó los Scouts?", o: ["Baden-Powell", "San Jorge", "B.P. Simpson"], c: "Baden-Powell"},
            {p: "¿Cuál es el lema Scout?", o: ["Siempre Listos", "Dar lo mejor", "Servir"], c: "Siempre Listos"},
            {p: "¿Dónde fue el Jamboree de 1999?", o: ["Picarquín", "Osorno", "Chillán"], c: "Picarquín"},
            {p: "¿Rama de 6 a 11 años?", o: ["Lobatos/Golondrinas", "Ruta", "Tropa"], c: "Lobatos/Golondrinas"},
            {p: "¿Animal símbolo de la Manada?", o: ["Lobo", "Zorro", "Águila"], c: "Lobo"},
            {p: "¿Flor símbolo Scout?", o: ["Flor de Lis", "Rosa", "Copihue"], c: "Flor de Lis"},
            {p: "¿Significado de la Buena Acción?", o: ["Ayudar al prójimo", "Hacer nudos", "Cantar"], c: "Ayudar al prójimo"},
            {p: "¿Color de la pañoleta nacional?", o: ["Rojo, azul y blanco", "Verde", "Gris"], c: "Rojo, azul y blanco"},
            {p: "¿Capital de Chile?", o: ["Santiago", "Valdivia", "Concepción"], c: "Santiago"},
            {p: "¿Idioma de Brasil?", o: ["Portugués", "Español", "Inglés"], c: "Portugués"},
            {p: "¿Planeta más grande?", o: ["Júpiter", "Marte", "Tierra"], c: "Júpiter"},
            {p: "¿Moneda de Chile?", o: ["Peso", "Dólar", "Euro"], c: "Peso"},
            {p: "¿Continente de Egipto?", o: ["África", "Asia", "Europa"], c: "África"},
            {p: "¿Metal más caro?", o: ["Rodio", "Oro", "Plata"], c: "Rodio"},
            {p: "¿Héroe de Iquique?", o: ["Arturo Prat", "O'Higgins", "Rodríguez"], c: "Arturo Prat"},
            {p: "¿Pintor de la Mona Lisa?", o: ["Da Vinci", "Van Gogh", "Dalí"], c: "Da Vinci"}
        ];

        let puntaje = 0;
        let t;
        let segs = 15;

        function cargar() {
            if (puntaje >= 40000) {
                document.getElementById('game-container').classList.add('hidden');
                document.getElementById('win-screen').classList.remove('hidden');
                return;
            }
            clearInterval(t);
            segs = 15;
            document.getElementById('timer').innerText = segs;
            
            const q = banco[Math.floor(Math.random() * banco.length)];
            document.getElementById('question').innerText = q.p;
            
            const caja = document.getElementById('options');
            caja.innerHTML = '';
            
            const opcionesMezcladas = [...q.o].sort(() => Math.random() - 0.5);
            
            opcionesMezcladas.forEach(opcion => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.innerText = opcion;
                
                b.onclick = () => {
                    // Bloquear otros clics mientras se muestra la respuesta
                    const botones = caja.querySelectorAll('.btn');
                    botones.forEach(btn => btn.style.pointerEvents = 'none');
                    clearInterval(t);

                    if (opcion === q.c) {
                        // ACIERTO: Solo verde
                        b.style.background = "#2ed573"; 
                        b.style.transform = "scale(1.05)";
                        puntaje += 5000;
                    } else {
                        // ERROR: Rojo el elegido, verde el correcto
                        b.style.background = "#ff4757";
                        botones.forEach(btn => {
                            if (btn.innerText === q.c) {
                                btn.style.background = "#2ed573";
                                btn.style.animation = "pulse 0.5s infinite";
                            }
                        });
                    }

                    document.getElementById('score').innerText = puntaje;
                    
                    // Esperar 1.5 segundos para ver el resultado antes de la siguiente
                    setTimeout(cargar, 1500);
                };
                caja.appendChild(b);
            });

            t = setInterval(() => {
                segs--;
                document.getElementById('timer').innerText = segs;
                if (segs <= 0) cargar();
            }, 1000);
        }
        cargar();
    </script>
</body>
</html>
